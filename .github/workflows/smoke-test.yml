name: Smoke test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Lets an organization variable choose the LSP ref to test against, see
      # https://github.com/sublimelsp/lsp_smoke_test#testing-against-an-lsp-branch
      LSP_SMOKE_TEST_LSP_REF: ${{ vars.LSP_SMOKE_TEST_LSP_REF }}
    steps:
      - uses: actions/checkout@v7

      # The language server needs the .NET 10 runtime.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - uses: sublimelsp/lsp_smoke_test@v1
        with:
          # Provides the Bicep syntax that the server is enabled for.
          extra-packages: Bicep:rwols/sublime-bicep@v
